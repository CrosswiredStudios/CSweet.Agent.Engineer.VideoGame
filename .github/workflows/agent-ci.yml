name: agent-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify CI dependency fallback
        env:
          CSWEET_RUN_DEPENDENCY_INTEGRATION: '1'
        run: python3 scripts/test-ci-dependencies.py
      - name: Prepare pinned C-Sweet dependencies
        env:
          CSWEET_DEPENDENCY_TOKEN: ${{ secrets.CSWEET_DEPENDENCY_READ_TOKEN }}
        run: python3 scripts/prepare-ci-dependencies.py
      - name: Test standalone clone with pinned packages
        run: dotnet test CSweet.Agent.Engineer.VideoGame.slnx -c Release -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetWorkManagementContracts=false
      - name: Verify manifest and configuration
        run: dotnet run --project src/CSweet.Agent.Engineer.VideoGame -c Release --no-build -- --self-test
      - name: Pack
        run: dotnet pack src/CSweet.Agent.Engineer.VideoGame -c Release --no-build --no-restore -o .artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: .artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Upload dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-ci-dependencies
          path: .artifacts/ci-dependencies/resolved.json
          if-no-files-found: ignore
